<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReLINK - 保護団体向け</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages.css">
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="notch"></div>
      <div class="screen">
        <div class="appbar">
          <a class="back" href="home.html">‹</a>
          <h1>保護団体向け</h1>
          <div class="spacer"></div>
          <span class="role-chip">Shelter</span>
        </div>

        <div class="pad stack">
          <div class="hero-banner">
            <div class="hi">保護団体向け機能</div>
            <div class="hn">保護中のペットを一覧で管理できます。</div>
            <div class="hs">照合状況やお知らせをまとめて確認できます。</div>
          </div>

          <div class="role-list">
            <div class="role-item">
              <div class="emo">📋</div>
              <div>
                <div class="title">保護ペット一覧</div>
                <div class="desc">保護中のペットを確認して照合を進めます。</div>
              </div>
            </div>
            <div class="role-item">
              <div class="emo">🔔</div>
              <div>
                <div class="title">お知らせ</div>
                <div class="desc">マッチング結果や受け渡しの通知を確認します。</div>
              </div>
            </div>
          </div>

          <a class="btn btn-primary" href="home.html">ホームへ戻る</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

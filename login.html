<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReLINK - ログイン</title>
  <style>
    :root {
      --navy: #141466;
      --navy-2: #1f1f8c;
      --navy-deep: #0d0d3d;
      --cyan: #22d3ee;
      --cyan-soft: #67e8f9;
      --ink: #1a1a2e;
      --paper: #f4f6fb;
      --card: #ffffff;
      --line: #dfe3f0;
      --muted: #6b7096;
      --shadow: 0 10px 30px rgba(20, 20, 102, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background:
        radial-gradient(1100px 600px at 50% -10%, rgba(34, 211, 238, 0.12), transparent 60%),
        linear-gradient(180deg, #e9edf7, #dfe4f2);
    }

    .phone {
      width: 390px;
      max-width: 100%;
      height: 820px;
      max-height: calc(100vh - 48px);
      background: var(--card);
      border-radius: 38px;
      box-shadow: 0 30px 80px rgba(13, 13, 61, 0.28), 0 0 0 10px #101038, 0 0 0 12px #22224e;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 26px;
      background: #101038;
      border-radius: 0 0 18px 18px;
      z-index: 40;
    }

    .screen {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      -webkit-overflow-scrolling: touch;
    }

    .screen::-webkit-scrollbar { width: 0; }

    .appbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--navy);
      color: #fff;
      padding: 34px 18px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .appbar h1 { font-size: 17px; font-weight: 800; letter-spacing: 0.3px; }
    .appbar .spacer { flex: 1; }
    .appbar .role-chip {
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(34, 211, 238, 0.18);
      color: var(--cyan-soft);
      border: 1px solid rgba(34, 211, 238, 0.35);
    }

    .pad { padding: 18px; }
    .stack > * + * { margin-top: 14px; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 15px 16px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      transition: transform 0.08s, box-shadow 0.15s, background 0.15s;
      text-decoration: none;
    }

    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--navy); color: #fff; box-shadow: 0 8px 20px rgba(20, 20, 102, 0.28); }
    .btn-primary:hover { background: var(--navy-2); }
    .btn-ghost { background: #eef1fa; color: var(--navy); border: 1px solid var(--line); }
    .btn-ghost:hover { background: #e6eaf7; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--navy);
    }

    h2.title {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.3;
      margin-top: 4px;
    }

    .lede {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.7;
      margin-top: 6px;
    }

    .field { display: block; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 6px;
    }

    .input {
      width: 100%;
      padding: 13px 14px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      background: #fbfcff;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input:focus {
      outline: none;
      border-color: var(--cyan);
      box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.18);
    }

    .roles { display: grid; gap: 12px; }
    .role {
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      background: #fff;
      transition: border-color 0.15s, background 0.15s;
      width: 100%;
      text-align: left;
      font: inherit;
    }

    .role:hover { border-color: var(--cyan-soft); }
    .role.on { border-color: var(--navy); background: #f2f4ff; }
    .role .emo { font-size: 26px; }
    .role .rt { font-weight: 800; font-size: 15px; }
    .role .rd { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .role .tick {
      margin-left: auto;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--line);
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 13px;
    }
    .role.on .tick { background: var(--navy); border-color: var(--navy); }

    .hero-banner {
      background: linear-gradient(150deg, var(--navy), var(--navy-deep));
      border-radius: 20px;
      padding: 20px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .hero-banner::after { content: "🐾"; position: absolute; right: -6px; bottom: -14px; font-size: 92px; opacity: 0.1; }
    .hero-banner .hi { font-size: 12px; color: var(--cyan-soft); font-weight: 700; }
    .hero-banner .hn { font-size: 19px; font-weight: 800; margin-top: 4px; }
    .hero-banner .hs { font-size: 12px; color: #c8ccf0; margin-top: 8px; line-height: 1.6; max-width: 80%; }

    .footnote { font-size: 11px; color: var(--muted); text-align: center; padding: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="notch"></div>
      <div class="screen">
        <div class="appbar">
          <h1>🐾 ReLINK</h1>
          <div class="spacer"></div>
          <span class="role-chip" id="roleChip">利用者選択</span>
        </div>

        <div class="pad stack">
          <div class="hero-banner">
            <div class="hi">ログイン</div>
            <div class="hn">つなぎ直そう、大切な家族と。</div>
            <div class="hs">利用者を選んでログインすると、対応する画面へ移動します。</div>
          </div>

          <div class="card">
            <div class="eyebrow">ROLE SELECT</div>
            <h2 class="title">どの利用者として進みますか？</h2>
            <p class="lede">選択した役割に応じて、飼い主・発見者・保護団体の各画面へ遷移します。</p>
            <div class="roles" style="margin-top: 12px;">
              <button class="role on" type="button" data-role="owner" data-url="owner.html">
                <div class="emo">🧑</div>
                <div>
                  <div class="rt">飼い主として使う</div>
                  <div class="rd">迷子のペットを登録して通知を受け取ります。</div>
                </div>
                <div class="tick">✓</div>
              </button>

              <button class="role" type="button" data-role="finder" data-url="finder.html">
                <div class="emo">🙋</div>
                <div>
                  <div class="rt">発見者として使う</div>
                  <div class="rd">保護したペットの写真を撮って照合します。</div>
                </div>
                <div class="tick">✓</div>
              </button>

              <button class="role" type="button" data-role="shelter" data-url="shelter.html">
                <div class="emo">🏥</div>
                <div>
                  <div class="rt">保護団体として使う</div>
                  <div class="rd">保護中のペットを確認・管理します。</div>
                </div>
                <div class="tick">✓</div>
              </button>
            </div>
          </div>

          <div class="card stack">
            <div class="field">
              <label for="email">メールアドレス</label>
              <input class="input" id="email" type="email" value="demo@relink.jp" placeholder="mail@example.com">
            </div>

            <div class="field">
              <label for="password">パスワード</label>
              <input class="input" id="password" type="password" value="demodemo" placeholder="••••••••">
            </div>

            <button class="btn btn-primary" id="loginButton" type="button">ログイン</button>
            <button class="btn btn-ghost" type="button" onclick="location.reload()">入力をリセット</button>
          </div>

          <div class="footnote">ReLINK はデモ版のため、入力内容は保存されません。</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const roleButtons = Array.from(document.querySelectorAll('.role'));
    const roleChip = document.getElementById('roleChip');
    const loginButton = document.getElementById('loginButton');
    let selectedUrl = 'owner.html';

    const roleLabels = {
      owner: '飼い主',
      finder: '発見者',
      shelter: '保護団体'
    };

    function selectRole(button) {
      roleButtons.forEach((item) => item.classList.remove('on'));
      button.classList.add('on');
      selectedUrl = button.getAttribute('data-url');
      roleChip.textContent = roleLabels[button.getAttribute('data-role')] || '利用者選択';
    }

    roleButtons.forEach((button) => {
      button.addEventListener('click', () => selectRole(button));
    });

    loginButton.addEventListener('click', () => {
      window.location.href = selectedUrl;
    });
  </script>
</body>
</html>

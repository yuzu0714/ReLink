<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReLINK - ログイン</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages.css">
  <link rel="stylesheet" href="styles/pc.css" media="screen and (min-width: 768px)">
</head>
<body data-page="login">
  <div class="stage">
    <div class="screen">
      <div class="appbar login-appbar">
        <div class="brand">
          <img class="brand-mark" src="logo.png" alt="ReLINK">
          <h1>ReLINK</h1>
        </div>
        <div class="spacer"></div>
        <span class="role-chip login-chip" id="roleChip">利用者選択</span>
      </div>

      <div class="pad stack login-pad">
        <div class="hero-banner login-welcome">
          <div class="hi">ログイン</div>
          <div class="hn">つなぎ直そう、大切な家族と。</div>
          <div class="hs">利用者を選んでログインすると、対応する画面へ移動します。</div>
        </div>

        <div class="login-grid">
          <div class="login-panel step-1">
            <div class="step-label">STEP 1</div>
            <h2 class="step-title">どの利用者として進みますか？</h2>
            <div class="step-desc">選択した役割に応じて、飼い主・発見者の各画面へ遷移します。</div>

            <div class="roles">
              <button class="role" type="button" data-role="owner" data-url="owner.html">
                <img class="emo" src="assets/owner.png" alt="飼い主">
                <div>
                  <div class="rt">飼い主として使う</div>
                  <div class="rd">迷子のペットを登録して通知を受け取ります。</div>
                </div>
                <div class="tick">✓</div>
              </button>

              <button class="role" type="button" data-role="finder" data-url="finder.html">
                <div class="emo">🙋</div>
                <div>
                  <div class="rt">発見者として使う</div>
                  <div class="rd">保護したペットの写真を撮って照合します。</div>
                </div>
                <div class="tick">✓</div>
              </button>
            </div>
          </div>

          <form id="loginForm" class="login-panel step-2">
            <div class="step-label">STEP 2</div>
            <h2 class="step-title">ログイン情報を入力</h2>
            <div class="step-desc">登録済みのメールアドレスとパスワードを入力してください。</div>

            <div class="field">
              <label for="email">メールアドレス</label>
              <input class="input" id="email" name="email" type="email" required>
            </div>

            <div class="field">
              <label for="password">パスワード</label>
              <input class="input" id="password" name="password" type="password" required>
            </div>

            <button class="btn btn-primary" id="loginButton" type="submit">ログイン</button>
            <button class="btn btn-reset btn-ghost" type="reset">入力をリセット</button>
            <button class="signup-link" type="button" onclick="location.href='signup.html'">新規登録はこちら →</button>
          </form>
        </div>

        <div class="footnote">ReLINK はデモ版のため、入力内容は保存されません。</div>
      </div>
    </div>
  </div>

  <script src="scripts/config.js"></script>
  <script src="scripts/common.js"></script>
  <script src="scripts/auth.js"></script>
</body>
</html>

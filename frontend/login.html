<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReLINK - ログイン</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages.css">
</head>
<body data-page="login" class="login-page">
  <div class="stage">
    <div class="screen">
      <div class="appbar">
        <div class="brand-mark">
          <img src="assets/Icon.png" alt="ReLINK ロゴ">
          <h1>ReLink</h1>
        </div>
        <div class="spacer"></div>
        <span class="role-chip" id="roleChip">利用者選択</span>
      </div>

      <main class="pad stack login-content">
        <div class="hero-banner">
          <div class="hi">ReLINKへようこそ</div>
          <div class="hn">飼い主・発見者としてログイン</div>
          <div class="hs">あなたの役割に合った画面から、大切な家族とのつながりを始めます。</div>
        </div>

        <div class="login-grid">
          <section class="card login-card">
          <div class="eyebrow">STEP 1</div>
          <h2 class="title">利用者の種類を選ぶ</h2>
          <p class="lede">選択した役割に応じて、飼い主・発見者の各画面へ遷移します。</p>
          <div class="roles">
            <button class="role" type="button" data-role="owner" data-url="owner.html">
              <img class="role-visual" src="assets/owner.png" alt="">
              <div>
                <div class="rt">飼い主として使う</div>
                <div class="rd">迷子のペットを登録して通知を受け取ります。</div>
              </div>
              <div class="tick">✓</div>
            </button>

            <button class="role" type="button" data-role="finder" data-url="finder.html">
              <img class="role-visual" src="assets/finder.png" alt="">
              <div>
                <div class="rt">発見者として使う</div>
                <div class="rd">保護したペットの写真を撮って照合します。</div>
              </div>
              <div class="tick">✓</div>
            </button>


          </div>
          </section>

        <form id="loginForm" class="card stack login-card">
          <div>
            <div class="eyebrow">STEP 2</div>
            <h2 class="title">アカウント情報を入力</h2>
          </div>
          <div class="field">
            <label for="email">メールアドレス</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" required>
          </div>

          <div class="field">
            <label for="password">パスワード</label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>

          <div class="login-actions">
            <button class="btn btn-accent" id="loginButton" type="submit">ログイン</button>
            <button class="btn btn-ghost" type="reset">入力をリセット</button>
          </div>
          <a class="signup-link" href="signup.html">アカウントをお持ちでない方はこちら →</a>
        </form>
        </div>

                <p class="footnote" style="text-align:center; margin-top:8px;">
          保護団体アカウントは
          <a href="shelter-login.html" style="color:var(--magenta,#e91e8c);">こちら</a>
        </p>
      <div class="footnote">ReLINK はデモ版のため、入力内容は保存されません。</div>
      </main>
    </div>
  </div>

    <script src="scripts/config.js"></script>
  <script src="scripts/common.js"></script>
  <script src="scripts/auth.js"></script>
</body>
</html>

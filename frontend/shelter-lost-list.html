<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReLINK — 迷子ペット一覧</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages.css">
  <link rel="stylesheet" href="styles/pc.css" media="screen and (min-width: 768px)">
  <!-- ★追加：状態ピルの色違い(オレンジ=候補あり / 緑=完了) -->
  <style>
    .pill.warn { background:#fff4e5; color:#b45309; border-color:#fed7aa; }
    .pill.ok   { background:#eafaf3; color:#0f7a4b; border-color:#a7f3d0; }
  </style>
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="notch"></div>
      <div class="screen">
        <!-- ★新規：戻る先は保護団体ホーム -->
        <div class="appbar">
          <a class="back" href="shelter.html">‹</a>
          <h1>迷子ペット一覧</h1>
          <div class="spacer"></div>
          <span class="role-chip">保護団体</span>
        </div>

        <div class="pad stack fade">
          <!-- 件数表示(JSが書き換える) -->
          <div class="lede" style="margin-top:2px" id="lostCount">読み込み中…</div>
          <!-- ★新規追加：絞り込みフィルター(最初は非表示。データ取得後にJSが表示する)
          shelter-list.html とデザインは同じだけど、IDは lost〜 にして保護側と区別している -->
          <div id="lostFilters" style="display:none" class="filter-bg">
            <div class="filter-wrapper">
              <div class="filter-wrapper-title">絞り込み条件を選択してください</div>
              <div class="filter-outer">
                <div class="filter-cols">

                  <!-- 左：地域 -->
                  <div class="filter-col-left">
                    <div class="filter-row filter-row-vertical">
                      <div class="filter-row-label">地域</div>
                      <div class="filter-row-body" id="lostFilterPlace"></div>
                    </div>
                  </div>

                  <!-- 右：犬種・毛色(縦に並ぶ) -->
                  <div class="filter-col-right">
                    <div class="filter-row filter-row-vertical" style="border-bottom:1px solid #e0e4ef">
                      <div class="filter-row-label">犬種・種類</div>
                      <div class="filter-row-body" id="lostFilterSpecie"></div>
                    </div>
                    <div class="filter-row filter-row-vertical">
                      <div class="filter-row-label">毛色</div>
                      <div class="filter-row-body" id="lostFilterColor"></div>
                    </div>
                  </div>

                </div>
              </div>
            </div>
            <!-- ★新規追加：条件をまとめて解除するボタン
                 (犬種のラジオボタンは一度選ぶと外せないので、リセット用に用意した) -->
            <button type="button" class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="resetLostFilters()">
              条件をリセット
            </button>
          </div>

          <!-- 迷子ペットのカードが入る場所(JSが書き込む) -->
          <div id="lostListBody" class="match-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ★shelter-list.html と同じ読み込み順。一覧の処理は shelter.js に入れてある -->
  <script src="scripts/config.js"></script>
  <script src="scripts/common.js"></script>
  <script src="scripts/auth.js"></script>
  <script src="scripts/shelter.js"></script>
</body>
</html>

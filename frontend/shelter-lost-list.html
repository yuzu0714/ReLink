<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReLINK — 迷子ペット一覧</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages.css">
  <link rel="stylesheet" href="styles/pc.css" media="screen and (min-width: 768px)">
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="notch"></div>
      <div class="screen">
        <!-- ★新規：戻る先は保護団体ホーム -->
        <div class="appbar">
          <a class="back" href="shelter.html">‹</a>
          <h1>迷子ペット一覧</h1>
          <div class="spacer"></div>
          <span class="role-chip">保護団体</span>
        </div>

        <div class="pad stack fade">
          <!-- 件数表示(JSが書き換える) -->
          <div class="lede" style="margin-top:2px" id="lostCount">読み込み中…</div>

          <!-- 迷子ペットのカードが入る場所(JSが書き込む) -->
          <div id="lostListBody" class="match-grid"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ★shelter-list.html と同じ読み込み順。一覧の処理は shelter.js に入れてある -->
  <script src="scripts/config.js"></script>
  <script src="scripts/common.js"></script>
  <script src="scripts/auth.js"></script>
  <script src="scripts/shelter.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReLINK - 飼い主向け</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages.css">
</head>
<body data-page="owner" class="owner-page">
  <div class="stage">
    <div class="phone">
      <div class="notch"></div>
      <div class="screen">
        <div class="appbar">
          <a class="back" href="login.html">‹</a>
          <h1>飼い主向け</h1>
          <div class="spacer"></div>
          <span class="role-chip">Owner</span>
        </div>

        <div class="pad stack">
          <div class="hero-banner">
            <div class="hi">飼い主向け機能</div>
            <div class="hn">迷子のペットをすばやく登録できます。</div>
            <div class="hs">通知とマッチングの状況を確認して、安心して待てます。</div>
          </div>

          <div class="owner-actions">
            <div class="card card-nav owner-action" data-owner-action="register">
              <div class="emo">📷</div>
              <div>
                <div class="t">ペット情報を登録</div>
                <div class="d">迷子のペットの写真をアップして照合を開始</div>
              </div>
              <div class="arr">›</div>
            </div>
            <div class="card card-nav owner-action" data-owner-action="notify">
              <div class="emo">🔔</div>
              <div>
                <div class="t">通知を確認</div>
                <div class="d">似たペットが保護されたらここに届きます。</div>
              </div>
              <div class="arr">›</div>
            </div>
            <div class="card card-nav owner-action" data-owner-action="notice-list">
              <div class="ic owner-notice-icon">🐕</div>
              <div>
                <div class="t">お知らせ一覧</div>
                <div class="d">最新の照合・保護情報をまとめて確認</div>
              </div>
              <div class="arr">›</div>
            </div>
          </div>

          <div class="stack">
          <a class="btn btn-primary" data-owner-action="logout" href="login.html">
            ログアウト
          </a>

          <button class="btn btn-ghost" data-owner-action="switch-role">
            役割を切り替える
          </button>
        </div>
        </div>
      </div>
    </div>
  </div>
  <script src="demo.js"></script>
</body>
</html>

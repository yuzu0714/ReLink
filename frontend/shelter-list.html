<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ReLINK — 保護ペット一覧</title>

  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages.css">
</head>

<body>

  <div class="stage">
    <div class="phone">

      <div class="notch"></div>

      <div class="screen">

        <!-- アプリバー -->
        <div class="appbar">
          <a class="back" href="shelter.html">‹</a>

          <h1>保護ペット一覧</h1>

          <div class="spacer"></div>

          <span class="role-chip">保護団体</span>
        </div>


        <!-- メインコンテンツ -->
        <div class="pad stack fade">

          <!-- 件数 -->
          <div class="lede" style="margin-top:2px" id="shelterCount">
            読み込み中…
          </div>

          <!-- ここに /shelter/pets の結果を差し込む -->
          <div id="shelterListBody"></div>

          <!-- 新しい保護を登録 -->
          <a
            class="btn btn-primary"
            href="register.html"
          >
            ＋ 新しい保護を登録
          </a>

        </div>

      </div>
    </div>
  </div>

  <script src="scripts/common.js"></script>
  <script src="scripts/auth.js"></script>
  <script src="scripts/shelter.js"></script>
</body>
</html>

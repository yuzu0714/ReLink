<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ReLINK — 保護ペットの詳細</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages.css">
</head>

<body>

  <div class="stage">
    <div class="phone">

      <div class="notch"></div>

      <div class="screen">
        <div class="appbar">

          <a class="back" href="shelter-list.html">
            ‹
          </a>

          <h1>保護ペットの詳細</h1>

          <div class="spacer"></div>

          <span class="role-chip">
            保護団体
          </span>

        </div>

        <div class="pad stack fade">

            <div class="pet-main">
                <div class="pet-photo" id="petPhoto"></div>
            
                <div class="pet-detail-info">

                    <div class="pet-title">
                        <h2 class="title" id="petName"></h2>
                        <span class="pill" id="petStatus">
                            照合中
                        </span>
                    </div>

                    <div class="card stack pet-info">
                        <div class="info-row">
                            <span class="lede">種類</span>
                            <b id="petBreed"></b>
                        </div>

                        <div class="info-row">
                            <span class="lede">毛色</span>
                            <b id="petColor"></b>
                        </div>

                        <div class="info-row">
                            <span class="lede">発見場所</span>
                            <b id="petLocation"></b>
                        </div>

                        <div class="info-row">
                            <span class="lede">保護日</span>
                            <b id="petDate"></b>
                        </div>

                        <div class="info-row">
                            <span class="lede">その他</span>
                            <b id="petCollar"></b>
                        </div>
          
                    </div>

                </div>
            </div>

          <button
            class="btn btn-magenta"
            id="updateButton">
            保護情報を更新
          </button>

        </div>

      </div>
    </div>
  </div>

  <script src="scripts/config.js"></script>
  <script src="scripts/common.js"></script>
  <script src="scripts/auth.js"></script>
  <script src="scripts/shelter.js"></script>

</body>
</html>

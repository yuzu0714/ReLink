<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReLINK — 会話の確認</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages.css">
  <link rel="stylesheet" href="styles/pc.css" media="screen and (min-width: 768px)">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    /* ★追加：このページ専用のスタイル(会話一覧とメッセージ表示) */
    .cm-notice { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412;
                 border-radius:12px; padding:12px 14px; font-size:12.5px; line-height:1.6; }

    /* 会話一覧のカード */
    .cm-list { display:grid; gap:10px; }
    .cm-item { display:flex; align-items:center; gap:12px; width:100%; padding:14px;
               border:1.5px solid var(--line); border-radius:14px; background:#fff;
               text-align:left; cursor:pointer; font:inherit; }
    .cm-item:hover, .cm-item:focus-visible { border-color:var(--orange); outline:none; }
    .cm-avatar { display:grid; place-items:center; width:44px; height:44px; flex:none;
                 border-radius:50%; background:#dbeafe; color:var(--navy); font-size:18px; }
    .cm-main { min-width:0; flex:1; }
    .cm-names { font-weight:800; color:var(--navy); font-size:14px; }
    .cm-sub { margin-top:3px; color:var(--muted); font-size:12px;
              overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .cm-meta { text-align:right; flex:none; font-size:11px; color:var(--muted); }
    .cm-count { display:inline-block; margin-top:4px; padding:2px 8px; border-radius:999px;
                background:#eef1fa; color:var(--navy); font-weight:700; }

    /* 会話ルーム(閲覧専用) */
    .cm-room { display:grid; grid-template-rows:auto minmax(260px,1fr); min-height:520px; }
    .cm-room-head { display:flex; align-items:center; gap:10px; padding-bottom:12px;
                    border-bottom:1px solid var(--line); }
    .cm-back { border:0; background:transparent; color:var(--navy); font-size:26px; cursor:pointer; }
    .cm-messages { display:flex; flex-direction:column; gap:10px; overflow-y:auto; padding:16px 2px; }
    .cm-bubble { max-width:78%; padding:10px 12px; border-radius:14px; font-size:13px;
                 line-height:1.5; white-space:pre-wrap; display:flex; flex-direction:column; gap:3px; }
    /* A(ID小さい方)=左 / B=右 で固定。誰がどっちかは名前ラベルで分かる */
    .cm-bubble.a { align-self:flex-start; background:#f0f2f7; color:var(--navy); }
    .cm-bubble.b { align-self:flex-end; background:var(--orange); color:#fff; }
    .cm-from { font-size:10px; font-weight:800; opacity:.75; }
    .cm-time { font-size:10px; opacity:.65; align-self:flex-end; }
    .cm-empty { text-align:center; padding:48px 16px; color:var(--muted); font-size:14px; }
  </style>
</head>
<body data-page="chat-monitor">
  <div class="stage">
    <div class="phone">
      <div class="notch"></div>
      <div class="screen">
        <div class="appbar">
          <a class="back" href="shelter.html">‹</a>
          <h1>会話の確認</h1>
          <div class="spacer"></div>
          <span class="role-chip">保護団体</span>
        </div>

        <!-- ★JSがここに「会話一覧」か「会話ルーム」を描画する -->
        <div class="pad stack fade" id="cm-root">
          <div class="cm-empty">読み込み中…</div>
        </div>
      </div>
    </div>
  </div>

  <script src="scripts/config.js"></script>
  <script src="scripts/common.js"></script>
  <script src="scripts/auth.js"></script>
  <script src="scripts/chat-monitor.js"></script>
</body>
</html>

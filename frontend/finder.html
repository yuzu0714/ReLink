<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReLINK - 発見者向け</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages.css">
  <link rel="stylesheet" href="styles/pc.css" media="screen and (min-width: 768px)">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body data-page="finder">
  <div class="stage">
    <div class="phone">
      <div class="notch"></div>
      <div class="screen" id="screen">
        <div class="appbar">
          <button class="back" onclick="window.history.back()">‹</button>
          <h1>発見者向け</h1>
          <div class="spacer"></div>
          <span class="role-chip">発見者</span>
        </div>

        <div class="pad stack">
          <div class="hero-banner login-welcome">
            <div class="hi">発見者向け機能</div>
            <div class="hn">保護したペットを撮影して照合できます。</div>
            <div class="hs">保護場所と日時を記録して、すぐに登録に進めます。</div>
          </div>

          <div class="role-list nav-grid">
            <div class="card card-nav owner-action" style="cursor:pointer" onclick="go('register')">
              <div class="emo"><i class="fa-solid fa-camera"></i></div>
              <div>
                <div class="t">ペットを保護・撮影</div>
                <div class="d">全体像と首輪の写真を追加</div>
              </div>
              <div class="arr">›</div>
            </div>
            <div class="card card-nav owner-action" style="cursor:pointer" onclick="go('handoverList')">
              <div class="emo"><i class="fa-solid fa-arrow-right-arrow-left"></i></div>
              <div>
                <div class="t">受け渡し記録</div>
                <div class="d">引き渡しの記録を確認</div>
              </div>
              <div class="arr">›</div>
            </div>
            <div class="card card-nav owner-action" style="cursor:pointer" onclick="go('notificationList')">
              <div class="emo"><i class="fa-solid fa-bell"></i></div>
              <div>
                <div class="t">お知らせ</div>
                <div class="d">マッチング結果と引き渡し通知を確認</div>
              </div>
              <div class="arr">›</div>
            </div>
            <div class="card card-nav owner-action" style="cursor:pointer" onclick="window.location.href='chat.html'">
              <div class="emo"><i class="fa-solid fa-message"></i></div>
              <div>
                <div class="t">保護団体とチャット</div>
                <div class="d">保護団体を選んでメッセージを送れます</div>
              </div>
              <div class="arr">›</div>
            </div>
          </div>

          <div class="link-row">
            <a class="btn btn-orange" data-owner-action="logout" href="login.html">
              ログアウト
            </a>

            <button class="btn btn-orange" data-owner-action="switch-role">
              役割を切り替える
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="scripts/config.js"></script>
  <script src="scripts/common.js"></script>
  <script src="scripts/auth.js"></script>
  <script src="scripts/finder.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>チャット | ReLINK</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    .chat-contacts { display: grid; gap: 10px; }
    .chat-contact { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; text-align: left; cursor: pointer; font: inherit; }
    .chat-contact:hover, .chat-contact:focus-visible { border-color: var(--orange); outline: none; }
    .chat-avatar { display: grid; place-items: center; width: 44px; height: 44px; flex: none; border-radius: 50%; background: #dbeafe; color: var(--navy); font-size: 20px; }
    .chat-contact-name { font-weight: 800; color: var(--navy); }
    .chat-contact-preview { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .chat-contact-arrow { margin-left: auto; color: var(--muted); font-size: 22px; }
    .chat-room { display: grid; grid-template-rows: auto minmax(260px, 1fr) auto; min-height: 520px; }
    .chat-room-head { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .chat-back { border: 0; background: transparent; color: var(--navy); font-size: 26px; cursor: pointer; }
    .chat-messages { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding: 16px 2px; }
    .chat-bubble { max-width: 78%; padding: 10px 12px; border-radius: 14px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
    .chat-bubble.them { align-self: flex-start; background: #f0f2f7; color: var(--navy); }
    .chat-bubble.me { align-self: flex-end; background: var(--orange); color: #fff; }
    .chat-bubble { display: flex; flex-direction: column; gap: 2px; }
    .chat-time { font-size: 10px; opacity: 0.65; align-self: flex-end; }
    .chat-bubble.them .chat-time { align-self: flex-start; }
    .chat-form { display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); }
    .chat-form .input { flex: 1; }
    .chat-form .btn { flex: none; width: auto; }
    .chat-empty, .chat-loading { text-align: center; padding: 48px 16px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body data-page="chat">
  <main class="screen">
    <div class="appbar">
      <button class="back" onclick="history.back()">‹</button>
      <h1>チャット</h1>
      <div class="spacer"></div>
    </div>
    <div class="pad stack" id="chat-root">
      <div class="chat-loading">チャット相手を読み込み中...</div>
    </div>
  </main>
  <script src="scripts/config.js"></script>
  <script src="scripts/common.js"></script>
  <script src="scripts/auth.js"></script>
  <script src="scripts/chat.js?v=2"></script>
</body>
</html>

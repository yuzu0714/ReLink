<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReLINK - 保護団体ログイン</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages.css">
  <style>
    .shelter-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--magenta, #e91e8c);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 99px;
      letter-spacing: .04em;
      margin-bottom: 16px;
    }
    .shelter-info {
      background: rgba(233, 30, 140, .06);
      border: 1px solid rgba(233, 30, 140, .2);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 13px;
      color: var(--muted, #888);
      line-height: 1.6;
    }
    .shelter-info strong {
      color: var(--fg, #1a1a2e);
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted, #888);
    }
    .back-link a {
      color: var(--magenta, #e91e8c);
    }
  </style>
</head>
<body data-page="shelter-login" class="login-page">
  <div class="stage">
    <div class="screen">
      <div class="appbar">
        <div class="brand-mark">
          <img src="assets/Icon.png" alt="ReLINK ロゴ">
          <h1>ReLink</h1>
        </div>
        <div class="spacer"></div>
        <span class="role-chip">保護団体</span>
      </div>

      <main class="pad stack login-content">
        <div class="hero-banner">
          <div class="hi">保護団体ポータル</div>
          <div class="hn">保護団体アカウントでログイン</div>
          <div class="hs">保護中のペット情報の管理・照合結果の確認ができます。</div>
        </div>

        <div class="login-grid" style="grid-template-columns:1fr;">
          <form id="loginForm" class="card stack login-card">
            <div>
              <span class="shelter-badge">🏠 保護団体専用</span>
              <h2 class="title">アカウント情報を入力</h2>
            </div>

            <div class="shelter-info">
              <strong>保護団体アカウント</strong>とは、動物保護施設・保健所・NPO法人など、
              ペットの保護・収容を行う団体向けのアカウントです。<br>
              一般の飼い主・発見者の方は<a href="login.html" style="color:var(--magenta,#e91e8c);">一般ログイン</a>をご利用ください。
            </div>

            <div class="field">
              <label for="email">メールアドレス</label>
              <input class="input" id="email" name="email" type="email" autocomplete="email" required>
            </div>

            <div class="field">
              <label for="password">パスワード</label>
              <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>

            <div class="login-actions">
              <button class="btn btn-accent" id="loginButton" type="submit">ログイン</button>
              <button class="btn btn-ghost" type="reset">入力をリセット</button>
            </div>

            <a class="signup-link" href="signup.html?role=shelter">アカウントをお持ちでない方はこちら →</a>
          </form>

          <p class="back-link">
            一般ユーザーの方は <a href="login.html">← 一般ログインページへ</a>
          </p>
        </div>

        <div class="footnote">ReLINK はデモ版のため、入力内容は保存されません。</div>
      </main>
    </div>
  </div>

  <script src="scripts/config.js"></script>
  <script src="scripts/common.js"></script>
  <script src="scripts/auth.js"></script>
  <script>
    // 保護団体専用ページ：ロールを shelter に固定して初期化
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      const loginButton = document.getElementById('loginButton');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = form.email.value;
        const password = form.password.value;

        loginButton.disabled = true;
        loginButton.textContent = 'ログイン中…';

        try {
          const result = await apiLogin(email, password, 'shelter');

          if (result.success) {
            sessionStorage.setItem('authToken', result.token);
            sessionStorage.setItem('selectedRole', result.role);
            window.location.href = 'shelter.html';
          }
        } catch (error) {
          alert(error.message);
        } finally {
          loginButton.disabled = false;
          loginButton.textContent = 'ログイン';
        }
      });
    });
  </script>
</body>
</html>

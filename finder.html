<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReLINK - 発見者向け</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages.css">

</head>
<body data-page="finder">
  <div class="stage">
    <div class="phone">
      <div class="notch"></div>
      <div class="screen" id="screen">
        <div class="appbar">
          <button class="back" onclick="window.history.back()">‹</button>
          <h1>発見者向け</h1>
          <div class="spacer"></div>
          <span class="role-chip">Finder</span>
        </div>

        <div class="pad stack">
          <div class="hero-banner">
            <div class="hi">発見者向け機能</div>
            <div class="hn">保護したペットを撮影して照合できます。</div>
            <div class="hs">保護場所と日時を記録して、すぐに登録に進めます。</div>
          </div>

          <div class="role-list">
            <div class="role-item" style="cursor:pointer" onclick="go('register')">
              <div class="emo">📸</div>
              <div>
                <div class="title">ペットを保護・撮影</div>
                <div class="desc">全体像と首輪の写真を追加します。</div>
              </div>
            </div>
            <div class="role-item" style="cursor:pointer" onclick="go('handoverList')">
              <div class="emo">🔄</div>
              <div>
                <div class="title">受け渡し記録</div>
                <div class="desc">引き渡しの記録を確認できます。</div>
              </div>
            </div>
          </div>

          <div class="stack">
            <a class="btn btn-primary" href="login.html">ログアウト</a>
            <button class="btn btn-ghost" type="button" onclick="switchRole()">役割を切り替える</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function switchRole() {
      sessionStorage.removeItem('selectedRole');
      window.location.href = 'login.html';
    }
  </script>
  <script src="demo.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReLINK — 災害時ペット保護・マッチングシステム</title>
<style>
  :root{
    --navy:#141466;
    --navy-2:#1f1f8c;
    --navy-deep:#0d0d3d;
    --cyan:#22d3ee;
    --cyan-soft:#67e8f9;
    --magenta:#ec4899;
    --magenta-soft:#f9a8d4;
    --green:#16a34a;
    --ink:#1a1a2e;
    --paper:#f4f6fb;
    --card:#ffffff;
    --line:#dfe3f0;
    --muted:#6b7096;
    --shadow:0 10px 30px rgba(20,20,102,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  /* Phone frame */
  .stage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    background:
      radial-gradient(1100px 600px at 50% -10%, rgba(34,211,238,.12), transparent 60%),
      linear-gradient(180deg,#e9edf7,#dfe4f2);
  }
  .phone{
    width:390px;
    max-width:100%;
    height:820px;
    max-height:calc(100vh - 48px);
    background:var(--card);
    border-radius:38px;
    box-shadow:0 30px 80px rgba(13,13,61,.28), 0 0 0 10px #101038, 0 0 0 12px #22224e;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .notch{
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:150px;height:26px;background:#101038;border-radius:0 0 18px 18px;z-index:40;
  }
  .screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch}
  .screen::-webkit-scrollbar{width:0}

  /* App bar */
  .appbar{
    position:sticky;top:0;z-index:30;
    background:var(--navy);
    color:#fff;
    padding:34px 18px 14px;
    display:flex;align-items:center;gap:10px;
  }
  .appbar .back{
    background:rgba(255,255,255,.12);border:none;color:#fff;width:32px;height:32px;
    border-radius:10px;font-size:18px;cursor:pointer;display:grid;place-items:center;
    transition:background .15s;
  }
  .appbar .back:hover{background:rgba(255,255,255,.24)}
  .appbar h1{font-size:17px;font-weight:800;letter-spacing:.3px}
  .appbar .spacer{flex:1}
  .appbar .role-chip{
    font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;
    background:rgba(34,211,238,.18);color:var(--cyan-soft);border:1px solid rgba(34,211,238,.35);
  }

  .pad{padding:18px}
  .stack>*+*{margin-top:14px}

  /* Buttons */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:15px 16px;border-radius:14px;border:none;cursor:pointer;
    font-size:15px;font-weight:700;font-family:inherit;transition:transform .08s, box-shadow .15s, background .15s;
  }
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--navy);color:#fff;box-shadow:0 8px 20px rgba(20,20,102,.28)}
  .btn-primary:hover{background:var(--navy-2)}
  .btn-magenta{background:var(--magenta);color:#fff;box-shadow:0 8px 20px rgba(236,72,153,.30)}
  .btn-magenta:hover{background:#db2777}
  .btn-ghost{background:#eef1fa;color:var(--navy);border:1px solid var(--line)}
  .btn-ghost:hover{background:#e6eaf7}
  .btn-cyan{background:var(--cyan);color:#083344;box-shadow:0 8px 20px rgba(34,211,238,.35)}
  .btn-sm{padding:11px 14px;font-size:13px;border-radius:11px;width:auto}

  /* Cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
  .card-nav{cursor:pointer;transition:transform .12s, box-shadow .15s;display:flex;align-items:center;gap:14px}
  .card-nav:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(20,20,102,.16)}
  .card-nav .ic{
    width:52px;height:52px;border-radius:15px;flex:none;display:grid;place-items:center;font-size:24px;
    background:linear-gradient(140deg,var(--navy),var(--navy-2));color:var(--cyan-soft);
  }
  .card-nav .t{font-weight:800;font-size:15px}
  .card-nav .d{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
  .card-nav .arr{margin-left:auto;color:var(--muted);font-size:20px}

  .eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--magenta)}
  h2.title{font-size:22px;font-weight:800;line-height:1.3;margin-top:4px}
  .lede{font-size:13px;color:var(--muted);line-height:1.7;margin-top:6px}

  .field{display:block}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:6px}
  .input, select.input, textarea.input{
    width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;
    font-size:14px;font-family:inherit;background:#fbfcff;transition:border-color .15s, box-shadow .15s;
  }
  .input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 4px rgba(34,211,238,.18)}
  textarea.input{resize:none;min-height:76px}

  /* Segmented role select */
  .roles{display:grid;gap:12px}
  .role{
    border:2px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;
    display:flex;align-items:center;gap:14px;background:#fff;transition:border-color .15s, background .15s;
  }
  .role:hover{border-color:var(--cyan-soft)}
  .role.on{border-color:var(--navy);background:#f2f4ff}
  .role .emo{font-size:26px}
  .role .rt{font-weight:800;font-size:15px}
  .role .rd{font-size:11.5px;color:var(--muted);margin-top:2px}
  .role .tick{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:13px}
  .role.on .tick{background:var(--navy);border-color:var(--navy)}

  /* paw loader */
  .loader-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:30px;text-align:center;background:linear-gradient(180deg,#fff,#f0f3ff)}
  .paw{position:relative;width:120px;height:120px;margin-bottom:8px}
  .paw .pad-shape{position:absolute;background:var(--line);border-radius:50%;overflow:hidden}
  .paw .fill{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,var(--magenta),var(--cyan));transition:height .3s ease}
  .toe{width:26px;height:34px}
  .toe.t1{left:8px;top:34px;transform:rotate(-18deg)}
  .toe.t2{left:38px;top:14px}
  .toe.t3{left:68px;top:14px}
  .toe.t4{left:96px;top:34px;transform:rotate(18deg);width:26px}
  .heel{width:66px;height:56px;left:27px;top:60px;border-radius:46% 46% 42% 42%}
  .mm{font-weight:800;font-size:17px;color:var(--navy);margin-top:6px}
  .barwrap{width:100%;max-width:280px;margin:14px auto 0}
  .bar{height:14px;background:#e4e8f6;border-radius:999px;overflow:hidden}
  .bar>i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--magenta),var(--magenta) 8px,var(--magenta-soft) 8px,var(--magenta-soft) 16px);transition:width .3s;border-radius:999px}
  .pct{font-weight:800;color:var(--magenta);font-size:20px;margin-top:8px}

  /* result list */
  .match-card{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff;box-shadow:var(--shadow)}
  .match-card .ph{width:66px;height:66px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:30px;color:#fff}
  .match-card .name{font-weight:800;font-size:14px}
  .match-card .meta{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.5}
  .score{margin-left:auto;text-align:center;flex:none}
  .score b{display:block;font-size:19px;color:var(--magenta);line-height:1}
  .score span{font-size:9px;color:var(--muted);font-weight:700;letter-spacing:.5px}

  .notif{display:flex;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--line);background:#fff}
  .notif .dot{width:10px;height:10px;border-radius:50%;background:var(--magenta);flex:none;margin-top:5px}
  .notif.read .dot{background:var(--line)}
  .notif .nt{font-weight:700;font-size:13.5px}
  .notif .nb{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
  .notif .tm{font-size:10.5px;color:var(--muted);margin-top:6px}

  .hero-banner{
    background:linear-gradient(150deg,var(--navy),var(--navy-deep));
    border-radius:20px;padding:20px;color:#fff;position:relative;overflow:hidden;
  }
  .hero-banner::after{content:"🐾";position:absolute;right:-6px;bottom:-14px;font-size:92px;opacity:.10}
  .hero-banner .hi{font-size:12px;color:var(--cyan-soft);font-weight:700}
  .hero-banner .hn{font-size:19px;font-weight:800;margin-top:4px}
  .hero-banner .hs{font-size:12px;color:#c8ccf0;margin-top:8px;line-height:1.6;max-width:80%}

  .success{text-align:center;padding:34px 22px;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:center;background:linear-gradient(180deg,#fff,#eefcff)}
  .success .ring{width:96px;height:96px;border-radius:50%;background:linear-gradient(140deg,var(--cyan),var(--navy));display:grid;place-items:center;font-size:46px;color:#fff;box-shadow:0 16px 40px rgba(20,20,102,.3)}
  .success h3{font-size:20px;font-weight:800;margin-top:20px}
  .success p{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.7}

  .pill{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;background:#eef1fa;color:var(--navy);border:1px solid var(--line)}
  .pill.mag{background:#fdecf5;color:var(--magenta);border-color:#fbcfe8}

  /* colour swatches for register */
  .swatches{display:flex;gap:10px;flex-wrap:wrap}
  .sw{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .1s}
  .sw:hover{transform:scale(1.08)}
  .sw.on{border-color:var(--navy)}

  .map{height:150px;border-radius:16px;position:relative;overflow:hidden;border:1px solid var(--line);
    background:
      linear-gradient(rgba(34,211,238,.06),rgba(34,211,238,.06)),
      repeating-linear-gradient(0deg,#eef1fa,#eef1fa 1px,transparent 1px,transparent 22px),
      repeating-linear-gradient(90deg,#eef1fa,#eef1fa 1px,transparent 1px,transparent 22px),
      #f7f9ff;}
  .map .pin{position:absolute;font-size:26px;transform:translate(-50%,-100%)}
  .map .you{left:50%;top:60%}
  .map .s1{left:28%;top:35%;font-size:20px}
  .map .s2{left:72%;top:42%;font-size:20px}

  .imgbox{border:2px dashed var(--cyan);border-radius:16px;padding:26px;text-align:center;background:#f2feff;cursor:pointer;transition:background .15s}
  .imgbox:hover{background:#e6fbff}
  .imgbox .big{font-size:38px}
  .imgbox .cap{font-size:12.5px;color:var(--muted);margin-top:8px}
  .thumbs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .thumb{width:56px;height:56px;border-radius:11px;display:grid;place-items:center;font-size:26px;color:#fff;position:relative}
  .thumb .x{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:grid;place-items:center;border:2px solid #fff}

  .footnote{font-size:11px;color:var(--muted);text-align:center;padding:14px;line-height:1.6}
  .cancel-link{background:none;border:none;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;margin-top:18px;font-family:inherit}

  .fade{animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="screen" id="screen"></div>
  </div>
</div>

<script>
/* ---------------- ReLINK demo — state & router ---------------- */
const S = {
  role: null,            // 'owner' | 'finder' | 'shelter'
  regPhotos: [],
  regColor: null,
  cancelMatch: false,
};

const screen = document.getElementById('screen');
const $ = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;};

const roleLabel = {owner:'飼い主', finder:'発見者', shelter:'保護団体'};
const roleChip = (r)=> r ? `<span class="role-chip">${roleLabel[r]}</span>` : '';

function appbar(title, backTo, role){
  return `<div class="appbar">
    ${backTo!==null?`<button class="back" onclick="go('${backTo}')">‹</button>`:''}
    <h1>${title}</h1><div class="spacer"></div>${roleChip(role)}
  </div>`;
}

const petColors = ['#c8935f','#e8c9a0','#7a5230','#3d3d3d','#e5e5e5','#f0f0f0'];
function petSwatch(i){return petColors[i%petColors.length];}

/* ---------------- Screens ---------------- */
const screens = {

/* LOGIN ---------------------------------------------------------- */
login(){
  const roleCard = (key,emo,t,d)=>`
    <div class="role ${S.role===key?'on':''}" onclick="setRole('${key}')">
      <div class="emo">${emo}</div>
      <div><div class="rt">${t}</div><div class="rd">${d}</div></div>
      <div class="tick">✓</div>
    </div>`;
  return `
  <div class="appbar" style="justify-content:center;padding-top:38px">
    <h1 style="font-size:24px;letter-spacing:1px">🐾 ReLINK</h1>
  </div>
  <div class="pad stack fade">
    <div style="text-align:center;margin:6px 0 4px">
      <div class="lede" style="margin-top:0">災害時ペット保護・マッチングシステム</div>
    </div>
    <div class="roles">
      ${roleCard('owner','🧑','飼い主として使う','迷子のペットを登録・通知を受け取る')}
      ${roleCard('finder','🙋','発見者として使う','保護したペットを撮影して照合する')}
      ${roleCard('shelter','🏥','保護団体として使う','保護中のペット一覧を管理する')}
    </div>
    <div class="field"><label>メールアドレス</label>
      <input class="input" type="email" value="demo@relink.jp" placeholder="mail@example.com"></div>
    <div class="field"><label>パスワード</label>
      <input class="input" type="password" value="demodemo" placeholder="••••••••"></div>
    <button class="btn btn-primary" onclick="login()">ログイン</button>
    <div class="footnote">ReLINK は事前登録なしでも利用できます。<br>デモ版のため入力内容は保存されません。</div>
  </div>`;
},

/* HOME ----------------------------------------------------------- */
home(){
  const nav = (scr,ic,t,d)=>`
    <div class="card card-nav" onclick="go('${scr}')">
      <div class="ic">${ic}</div>
      <div><div class="t">${t}</div><div class="d">${d}</div></div>
      <div class="arr">›</div>
    </div>`;

  let actions = '';
  if(S.role==='owner'){
    actions = nav('register','📷','ペット情報を登録','迷子のペットの写真をアップして照合を開始')
            + nav('notify','🔔','通知を確認','似たペットが保護されたらここに届きます');
  } else if(S.role==='finder'){
    actions = nav('register','📸','ペットを保護・撮影','全体像と首輪を撮って自動マッチング')
            + nav('notify','🔔','受け渡し記録','引き渡したペットの記録を確認');
  } else {
    actions = nav('shelterList','📋','保護ペット一覧','現在保護中のペットを確認・照合')
            + nav('register','📷','新規保護を登録','保護したペットを撮影して登録')
            + nav('notify','🔔','お知らせ','マッチング結果と受け渡し通知');
  }

  return `
  ${appbar('ホーム', null, S.role)}
  <div class="pad stack fade">
    <div class="hero-banner">
      <div class="hi">こんにちは、${roleLabel[S.role]}さん</div>
      <div class="hn">つなぎ直そう、大切な家族と。</div>
      <div class="hs">マイクロチップがなくても、写真だけでAIが飼い主とペットを結びます。</div>
    </div>
    ${actions}
    <div class="card card-nav" onclick="go('notify')">
      <div class="ic" style="background:linear-gradient(140deg,var(--magenta),#be185d)">🐕</div>
      <div><div class="t">お知らせ一覧</div><div class="d">最新の照合・保護情報をまとめて確認</div></div>
      <div class="arr">›</div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost btn-sm" style="flex:1" onclick="go('login')">ログアウト</button>
      <button class="btn btn-ghost btn-sm" style="flex:1" onclick="switchRole()">役割を切替</button>
    </div>
  </div>`;
},

/* REGISTER ------------------------------------------------------- */
register(){
  const finder = S.role!=='owner';
  return `
  ${appbar(finder?'ペットを保護・登録':'ペット情報を登録','home',S.role)}
  <div class="pad stack fade">
    <div>
      <div class="eyebrow">STEP 1 / 撮影</div>
      <h2 class="title" style="font-size:19px">${finder?'保護したペットを撮る':'手持ちの写真をアップ'}</h2>
      <div class="lede">全体像と、首輪がはっきり写った写真があるほど精度が上がります。事前登録は不要です。</div>
    </div>

    <div class="imgbox" onclick="addPhoto()">
      <div class="big">📸</div>
      <div class="cap"><b style="color:var(--navy)">タップして写真を追加</b><br>全体像 ＋ 首輪アップがおすすめ</div>
    </div>
    <div class="thumbs" id="thumbs">${renderThumbs()}</div>

    ${finder ? `
    <div class="field"><label>発見場所</label>
      <input class="input" value="石川県 輪島市 ○○町" placeholder="市区町村"></div>
    <div class="field"><label>発見日時</label>
      <input class="input" type="datetime-local" value="2026-07-07T09:30"></div>
    ` : `
    <div class="field"><label>連絡先電話番号</label>
      <input class="input" type="tel" value="090-1234-5678" placeholder="090-0000-0000"></div>
    `}

    <div class="field"><label>種類・犬種</label>
      <select class="input">
        <option>柴犬</option><option>トイプードル</option><option>雑種（中型）</option>
        <option>猫（雑種）</option><option>その他</option>
      </select></div>

    <div class="field"><label>毛色（複数選択可）</label>
      <div class="swatches" id="swatches">
        ${petColors.map((c,i)=>`<div class="sw ${S.regColor===i?'on':''}" style="background:${c}" onclick="pickColor(${i})"></div>`).join('')}
      </div></div>

    <div class="field"><label>そのほか（アレルギー・伝えたいこと）</label>
      <textarea class="input" placeholder="例）左耳が欠けている。人懐っこい。">赤い革の首輪。左後ろ足を少し引きずる。</textarea></div>

    <button class="btn btn-magenta" onclick="go('matching')">
      🐾 AIマッチングを開始
    </button>
    <div class="footnote">条件で絞り込んだ後、画像識別モデルが特徴を照合します。</div>
  </div>`;
},

/* MATCHING (signature loader) ------------------------------------ */
matching(){
  // rendered then animated by startMatch()
  return `
  <div class="loader-wrap fade">
    <div class="eyebrow" style="color:var(--magenta)">AI MATCHING</div>
    <div class="paw" id="paw">
      ${['t1','t2','t3','t4'].map(c=>`
        <div class="pad-shape toe ${c}"><div class="fill" style="height:0%"></div></div>`).join('')}
      <div class="pad-shape heel"><div class="fill" style="height:0%"></div></div>
    </div>
    <div class="mm">マッチング中…</div>
    <div class="barwrap">
      <div class="bar"><i id="bar" style="width:0%"></i></div>
      <div class="pct" id="pct">0%</div>
    </div>
    <div class="lede" style="max-width:260px">保護中のペットの中から、外見と首輪の特徴が近い子を探しています。</div>
    <button class="cancel-link" onclick="cancelMatch()">時間がかかる場合はキャンセル</button>
  </div>`;
},

/* RESULTS -------------------------------------------------------- */
results(){
  const data = [
    {n:'ぽん太',  m:95, c:0, meta:'柴犬・オス / ○○保健所で保護 / 首輪：赤い革'},
    {n:'候補 2',  m:93, c:1, meta:'柴犬・推定オス / △△市で発見 / 首輪：赤系'},
    {n:'候補 3',  m:91, c:2, meta:'柴系雑種 / □□町で保護 / 首輪あり'},
    {n:'候補 4',  m:89, c:3, meta:'柴犬・不明 / 発見者宅で一時保護'},

/* ---------------- Router & actions ---------------- */
function go(name){
  screen.scrollTop = 0;
  screen.innerHTML = screens[name]();
  if(name==='matching') startMatch();
}
function setRole(r){ S.role=r; go('login'); }
function login(){
  if(!S.role){ shake(); return; }
  go('home');
}
function switchRole(){ S.role=null; go('login'); }

function shake(){
  const roles=document.querySelector('.roles');
  if(!roles)return;
  roles.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:260});
}

/* register helpers */
function renderThumbs(){
  return S.regPhotos.map((c,i)=>`
    <div class="thumb" style="background:${petSwatch(c)}">🐕
      <div class="x" onclick="event.stopPropagation();rmPhoto(${i})">×</div>
    </div>`).join('');
}
function addPhoto(){
  S.regPhotos.push(S.regPhotos.length);
  const t=document.getElementById('thumbs');
  if(t) t.innerHTML=renderThumbs();
}
function rmPhoto(i){
  S.regPhotos.splice(i,1);
  const t=document.getElementById('thumbs');
  if(t) t.innerHTML=renderThumbs();
}
function pickColor(i){
  S.regColor=i;
  document.querySelectorAll('#swatches .sw').forEach((el,idx)=>el.classList.toggle('on',idx===i));
}

/* matching animation */
let matchTimer=null;
function startMatch(){
  S.cancelMatch=false;
  let p=0;
  const bar=document.getElementById('bar');
  const pct=document.getElementById('pct');
  const fills=document.querySelectorAll('#paw .fill');
  matchTimer=setInterval(()=>{
    if(S.cancelMatch){clearInterval(matchTimer);return;}
    p += Math.random()*7+3;
    if(p>=100){p=100;}
    bar.style.width=p+'%';
    pct.textContent=Math.round(p)+'%';
    fills.forEach(f=>f.style.height=p+'%');
    if(p>=100){
      clearInterval(matchTimer);
      setTimeout(()=>{ if(!S.cancelMatch) go('results'); },420);
    }
  },220);
}
function cancelMatch(){
  S.cancelMatch=true;
  if(matchTimer)clearInterval(matchTimer);
  go('register');
}

/* boot */
go('login');
</script>
